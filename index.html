<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octopus Wall</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Background Video */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      filter: brightness(0.8);
    }
    body {
      font-family: 'Roboto', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 20px;
      background-color: #000;
    }
    /* Header Styling with Red & Black Gradient */
    header {
      background: linear-gradient(135deg, #b30000, #0d0d0d);
      padding: 20px 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }
    header h1 {
      font-size: 24px;
    }
    header .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    /* Post Button */
    #postBtn {
      background-color: #b30000;
      color: #fff;
      font-weight: bold;
    }
    #postBtn:hover {
      background-color: #a30000;
      transform: scale(1.03);
    }
    /* Clear Button */
    #clearBtn {
      background-color: #0d0d0d;
      color: #b30000;
    }
    #clearBtn:hover {
      background-color: #1a1a1a;
      transform: scale(1.03);
    }
    /* Container Styling */
    .container {
      max-width: 95%;
      margin: 0 auto;
    }
    /* Masonry Layout Using CSS Columns */
    .grid {
      column-count: 3;
      column-gap: 15px;
    }
    .grid-item {
      break-inside: avoid;
      margin-bottom: 15px;
      background-color: #1a1a1a;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(179, 0, 0, 0.5);
      animation: fadeIn 0.5s ease;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .grid-item img {
      width: 100%;
      display: block;
    }
    /* Delete Button Overlay */
    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: rgba(179, 0, 0, 0.8);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .grid-item:hover .delete-btn {
      opacity: 1;
    }
    /* FadeIn Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Responsive Adjustments */
    @media (max-width: 800px) {
      .grid {
        column-count: 2;
      }
    }
    @media (max-width: 500px) {
      .grid {
        column-count: 1;
      }
      header {
        flex-direction: column;
        text-align: center;
      }
      header .buttons {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
<!-- Background Video Element -->
<video autoplay muted id="bgVideo">
  <source src="video2.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<header>
  <h1>Octopus Wall</h1>
  <div class="buttons">
    <button id="postBtn">Add More</button>
    <button id="clearBtn">Clear The Wall</button>
  </div>
  <!-- Hidden File Input to Trigger File Selection -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
</header>

<div class="container">
  <div class="grid" id="imageGrid">
    <!-- Dynamically Added Images Will Appear Here -->
  </div>
</div>

<script>
  // (No MASTER_KEY is declared here!)

  // Select necessary DOM elements
  const postBtn = document.getElementById('postBtn');
  const clearBtn = document.getElementById('clearBtn');
  const fileInput = document.getElementById('fileInput');
  const imageGrid = document.getElementById('imageGrid');
  const bgVideo = document.getElementById('bgVideo');

  // On DOM load, set up the video controls and load stored images
  window.addEventListener('DOMContentLoaded', () => {
    if (bgVideo) {
      bgVideo.playbackRate = 0.3;       // Play at 30% speed
      bgVideo.removeAttribute('loop');  // Disable looping
      setTimeout(() => {
        bgVideo.pause();                // Pause after 30 seconds
      }, 30000);
    }

    // Load images stored in localStorage (each image is an object: { src, filename })
    const storedImages = loadImagesFromStorage();
    storedImages.forEach(image => addImageToGrid(image));
  });

  // Trigger file selection when "Add More" is clicked
  postBtn.addEventListener('click', () => {
    fileInput.click();
  });

  // Clear the gallery by prompting for the master key and sending the request to your server if needed.
  // For clearing the gallery, you can choose to either do a local removal (if you want)
  // or send a server request (if your server manages deletion). Here we simply clear locally.
  clearBtn.addEventListener('click', () => {
    const userKey = prompt("Enter master key to clear the gallery:");
    // The server will verify the key; here, we assume you want to simply clear localStorage if deletion is approved.
    // Optionally, you could send a separate request to clear multiple files.
    // For a basic demo, we only clear client-side storage.
    // (Security note: In a real-world scenario, you’d send this key to your secure backend.)
    if (!userKey) {
      alert("No key entered. Gallery not cleared.");
      return;
    }
    // You may optionally send userKey to your backend to clear server-side files if desired.
    localStorage.removeItem('images');
    imageGrid.innerHTML = '';
  });

  // LocalStorage helper functions (store an array of objects: { src, filename })
  function saveImagesToStorage(imagesArray) {
    localStorage.setItem('images', JSON.stringify(imagesArray));
  }
  function loadImagesFromStorage() {
    const storedImages = localStorage.getItem('images');
    return storedImages ? JSON.parse(storedImages) : [];
  }

  // Create and append an image element to the grid; 'image' is an object { src, filename }
  function addImageToGrid(image) {
    const { src, filename } = image;
    const gridItem = document.createElement('div');
    gridItem.className = 'grid-item';
    // Optionally store the filename in a data attribute
    gridItem.dataset.filename = filename;

    const img = document.createElement('img');
    img.src = src;
    gridItem.appendChild(img);

    // Create delete button overlay for the image
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      const userKey = prompt("Enter master key to delete this image:");
      if (!userKey) {
        alert("No key entered. Image not deleted.");
        return;
      }
      // Send a deletion request to your Flask backend using the actual filename and the key supplied by the user.
      deleteImageFromServer(filename, gridItem, userKey);
    });
    gridItem.appendChild(deleteBtn);

    imageGrid.appendChild(gridItem);
  }

  // Remove an image from the grid and update storage by its filename
  function deleteImage(filename, gridItem) {
    gridItem.remove();
    let imagesArray = loadImagesToStorage();
    const index = imagesArray.findIndex(image => image.filename === filename);
    if (index > -1) {
      imagesArray.splice(index, 1);
    }
    saveImagesToStorage(imagesArray);
  }

  // Function to resize/compress an image file using a canvas; returns a Promise that resolves to the data URL
  function resizeImage(file, maxWidth = 600, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const scaleFactor = maxWidth / img.width;
          const canvas = document.createElement('canvas');
          canvas.width = maxWidth;
          canvas.height = img.height * scaleFactor;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Handle image uploads with resizing, assign a real filename, and update storage
  fileInput.addEventListener('change', async (event) => {
    const files = Array.from(event.target.files);
    let imagesArray = loadImagesFromStorage();
    try {
      // For each file, get the data URL and assign a generated filename
      const newImages = await Promise.all(
        files.filter(file => file && file.type.startsWith('image/'))
          .map(file => resizeImage(file).then(src => {
            // Generate a unique filename using the current timestamp and a random number
            const filename = "img_" + Date.now() + "_" + Math.floor(Math.random() * 1000) + ".jpg";
            return { src, filename };
          }))
      );
      newImages.forEach(image => addImageToGrid(image));
      imagesArray = imagesArray.concat(newImages);
      saveImagesToStorage(imagesArray);
    } catch (error) {
      console.error('Error processing files:', error);
    }
    fileInput.value = ''; // Reset file input
  });

  // Send a deletion request to the Flask backend using the user-supplied key
  async function deleteImageFromServer(filename, gridItem, userKey) {
    try {
      const response = await fetch('http://127.0.0.1:5000/delete_image', {  // Adjust URL as needed for your server
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: userKey, filename: filename })
      });
      const result = await response.json();
      if (response.ok && result.success) {
        alert("Image deleted successfully on the server.");
        // Remove it from the client view and update storage
        deleteImage(filename, gridItem);
      } else {
        alert("Deletion failed: " + (result.error || "Unknown error"));
      }
    } catch (err) {
      console.error(err);
      alert("An error occurred while deleting the image.");
    }
  }
</script>
</body>
</html>
