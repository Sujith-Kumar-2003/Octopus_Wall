
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Image Gallery</title>
  <style>
    /* Basic reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      padding: 10px;
    }
    /* Header with post button at top right */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      background-color: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }
    header button {
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      background-color: #007bff;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    /* Main container */
    .container {
      margin-top: 20px;
    }
    /* CSS Grid for image layout with auto-rows added */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      grid-auto-rows: auto;
      grid-gap: 10px;
    }
    .grid-item {
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #fff;
    }
    .grid-item img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
<header>
  <!-- The visible Post button -->
  <button id="postBtn">Post</button>
  <!-- Hidden file input to trigger file selection -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
</header>

<div class="container">
  <div class="grid" id="imageGrid">
    <!-- Dynamically added images will appear here -->
  </div>
</div>

<script>
  const postBtn = document.getElementById('postBtn');
  const fileInput = document.getElementById('fileInput');
  const imageGrid = document.getElementById('imageGrid');

  // Trigger file selection on Post button click
  postBtn.addEventListener('click', () => {
    fileInput.click();
  });

  // LocalStorage utility functions
  function saveImagesToStorage(imagesArray) {
    localStorage.setItem('images', JSON.stringify(imagesArray));
  }
  function loadImagesFromStorage() {
    const storedImages = localStorage.getItem('images');
    return storedImages ? JSON.parse(storedImages) : [];
  }

  // Create a grid item and append to the grid container
  function addImageToGrid(src) {
    const div = document.createElement('div');
    div.className = 'grid-item';

    const img = document.createElement('img');
    img.src = src;
    div.appendChild(img);
    imageGrid.appendChild(div);
  }

  // Promisified file reading function
  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = (err) => reject(err);
      reader.readAsDataURL(file);
    });
  }

  // Handle new file selections
  fileInput.addEventListener('change', async (event) => {
    const files = Array.from(event.target.files);
    let imagesArray = loadImagesFromStorage();

    try {
      const newImages = await Promise.all(
        files
          .filter(file => file && file.type.startsWith('image/'))
          .map(file => readFileAsDataURL(file))
      );
      newImages.forEach(src => addImageToGrid(src));
      imagesArray = imagesArray.concat(newImages);
      saveImagesToStorage(imagesArray);
    } catch (error) {
      console.error("Error reading files:", error);
    }
    fileInput.value = "";
  });

  // Load stored images when the page loads
  window.addEventListener('load', () => {
    const storedImages = loadImagesFromStorage();
    storedImages.forEach(src => addImageToGrid(src));
  });
</script>
</body>
</html>
