<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octopus Wall</title>
  <style>
    /* (Your existing CSS remains unchanged) */
    /* Background Video, header, grid-item styling, etc. */
  </style>
</head>
<body>
<!-- Background Video Element -->
<video autoplay muted id="bgVideo">
  <source src="{{ url_for('static', filename='video2.mp4') }}" type="video/mp4">
  Your browser does not support the video tag.
</video>

<header>
  <h1>Octopus Wall</h1>
  <div class="buttons">
    <button id="postBtn">Add More</button>
    <button id="clearBtn">Clear The Wall</button>
  </div>
  <!-- Hidden File Input to Trigger File Selection -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
</header>

<div class="container">
  <div class="grid" id="imageGrid">
    <!-- Dynamically Added Images Will Appear Here -->
  </div>
</div>

<script>
  // Select necessary DOM elements
  const postBtn = document.getElementById('postBtn');
  const clearBtn = document.getElementById('clearBtn');
  const fileInput = document.getElementById('fileInput');
  const imageGrid = document.getElementById('imageGrid');
  const bgVideo = document.getElementById('bgVideo');

  // On DOM load, set up video and load images from localStorage
  window.addEventListener('DOMContentLoaded', () => {
    if (bgVideo) {
      bgVideo.playbackRate = 0.3;   // 30% speed
      bgVideo.removeAttribute('loop');
      setTimeout(() => {
        bgVideo.pause();
      }, 30000);
    }
    // Load images stored in localStorage (each image: { src, filename })
    const storedImages = loadImagesFromStorage();
    storedImages.forEach(image => addImageToGrid(image));
  });

  // Trigger file selection when "Add More" is clicked
  postBtn.addEventListener('click', () => {
    fileInput.click();
  });

  // Clear the gallery (only client-side in this example)
  clearBtn.addEventListener('click', () => {
    const userKey = prompt("Enter master key to clear the gallery:");
    if (!userKey) {
      alert("No key entered. Gallery not cleared.");
      return;
    }
    // Optionally, you could also send a request to the backend to remove files
    localStorage.removeItem('images');
    imageGrid.innerHTML = '';
  });

  // LocalStorage helper functions
  function saveImagesToStorage(imagesArray) {
    localStorage.setItem('images', JSON.stringify(imagesArray));
  }
  function loadImagesFromStorage() {
    const storedImages = localStorage.getItem('images');
    return storedImages ? JSON.parse(storedImages) : [];
  }

  // Add image element to the grid (image: { src, filename })
  function addImageToGrid(image) {
    const { src, filename } = image;
    const gridItem = document.createElement('div');
    gridItem.className = 'grid-item';
    gridItem.dataset.filename = filename;

    const img = document.createElement('img');
    img.src = src;
    gridItem.appendChild(img);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      const userKey = prompt("Enter master key to delete this image:");
      if (!userKey) {
        alert("No key entered. Image not deleted.");
        return;
      }
      deleteImageFromServer(filename, gridItem, userKey);
    });
    gridItem.appendChild(deleteBtn);

    imageGrid.appendChild(gridItem);
  }

  // Remove image element and update localStorage
  function deleteImage(filename, gridItem) {
    gridItem.remove();
    let imagesArray = loadImagesFromStorage();
    const index = imagesArray.findIndex(image => image.filename === filename);
    if (index > -1) {
      imagesArray.splice(index, 1);
    }
    saveImagesToStorage(imagesArray);
  }

  // Handle image uploads: send the file to the Flask backend via FormData
  fileInput.addEventListener('change', async (event) => {
    const files = Array.from(event.target.files);
    let imagesArray = loadImagesFromStorage();
    for (const file of files) {
      // Create FormData and append the file
      const formData = new FormData();
      formData.append("file", file);
      try {
        const response = await fetch('https://octopus-wall.onrender.com/upload_image', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (response.ok && result.success) {
          // Use the returned filename from the server
          // Optionally, generate a data URL from the file for display
          const reader = new FileReader();
          reader.onload = function(e) {
            const dataUrl = e.target.result;
            const image = { src: dataUrl, filename: result.filename };
            addImageToGrid(image);
            imagesArray.push(image);
            saveImagesToStorage(imagesArray);
          };
          reader.readAsDataURL(file);
        } else {
          alert("Upload failed: " + (result.error || "Unknown error"));
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred during the file upload.");
      }
    }
    fileInput.value = '';  // Reset file input
  });

  // Send a deletion request to the Flask backend
  async function deleteImageFromServer(filename, gridItem, userKey) {
    try {
      const response = await fetch('https://octopus-wall.onrender.com/delete_image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: userKey, filename: filename })
      });
      const result = await response.json();
      if (response.ok && result.success) {
        alert("Image deleted successfully on the server.");
        deleteImage(filename, gridItem);
      } else {
        alert("Deletion failed: " + (result.error || "Unknown error"));
      }
    } catch (err) {
      console.error(err);
      alert("An error occurred while deleting the image.");
    }
  }
</script>
</body>
</html>
