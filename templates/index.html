<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octopus Wall</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Background Video */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      filter: brightness(0.8);
    }
    body {
      font-family: 'Roboto', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 20px;
      background-color: #000;
    }
    /* Header Styling with Red & Black Gradient */
    header {
      background: linear-gradient(135deg, #b30000, #0d0d0d);
      padding: 20px 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }
    header h1 {
      font-size: 24px;
    }
    header .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    /* Post Button */
    #postBtn {
      background-color: #b30000;
      color: #fff;
      font-weight: bold;
    }
    #postBtn:hover {
      background-color: #a30000;
      transform: scale(1.03);
    }
    /* Clear Button */
    #clearBtn {
      background-color: #0d0d0d;
      color: #b30000;
    }
    #clearBtn:hover {
      background-color: #1a1a1a;
      transform: scale(1.03);
    }
    /* Container Styling */
    .container {
      max-width: 95%;
      margin: 0 auto;
    }
    /* Masonry Layout Using CSS Columns */
    .grid {
      column-count: 3;
      column-gap: 15px;
    }
    .grid-item {
      break-inside: avoid;
      margin-bottom: 15px;
      background-color: #1a1a1a;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(179, 0, 0, 0.5);
      animation: fadeIn 0.5s ease;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .grid-item img {
      width: 100%;
      display: block;
    }
    /* Delete Button Overlay */
    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: rgba(179, 0, 0, 0.8);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .grid-item:hover .delete-btn {
      opacity: 1;
    }
    /* FadeIn Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Responsive Adjustments */
    @media (max-width: 800px) {
      .grid {
        column-count: 2;
      }
    }
    @media (max-width: 500px) {
      .grid {
        column-count: 1;
      }
      header {
        flex-direction: column;
        text-align: center;
      }
      header .buttons {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
<!-- Background Video Element -->
<video autoplay muted id="bgVideo">
  <source src="{{ url_for('static', filename='video2.mp4') }}" type="video/mp4">
  Your browser does not support the video tag.
</video>

<header>
  <h1>Octopus Wall</h1>
  <div class="buttons">
    <button id="postBtn">Add More</button>
    <button id="clearBtn">Clear The Wall</button>
  </div>
  <!-- Hidden File Input to Trigger File Selection -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple />
</header>

<div class="container">
  <div class="grid" id="imageGrid">
    <!-- Dynamically Added Images Will Appear Here -->
  </div>
</div>

<script>
  const postBtn = document.getElementById('postBtn');
  const clearBtn = document.getElementById('clearBtn');
  const fileInput = document.getElementById('fileInput');
  const imageGrid = document.getElementById('imageGrid');
  const bgVideo = document.getElementById('bgVideo');

  window.addEventListener('DOMContentLoaded', () => {
    if (bgVideo) {
      bgVideo.playbackRate = 0.3;
      bgVideo.removeAttribute('loop');
      setTimeout(() => bgVideo.pause(), 30000);
    }
    loadGlobalGallery();
  });

  postBtn.addEventListener('click', () => fileInput.click());

  clearBtn.addEventListener('click', () => {
    const userKey = prompt("Enter master key to clear the gallery:");
    if (!userKey) return alert("No key entered.");
    localStorage.removeItem('images');
    imageGrid.innerHTML = '';
  });

  async function loadGlobalGallery() {
    try {
      const response = await fetch('https://octopus-wall.onrender.com/list_images');
      const data = await response.json();
      if (response.ok && data.images) {
        data.images.forEach(filename => {
          const imageUrl = `https://octopus-wall.onrender.com/images/${filename}`;
          const image = { src: imageUrl, filename: filename };
          addImageToGrid(image);
        });
      }
    } catch (error) {
      console.error("Error loading global gallery:", error);
    }
  }

  function saveImagesToStorage(imagesArray) {
    localStorage.setItem('images', JSON.stringify(imagesArray));
  }

  function loadImagesFromStorage() {
    const storedImages = localStorage.getItem('images');
    return storedImages ? JSON.parse(storedImages) : [];
  }

  function addImageToGrid(image) {
    const { src, filename } = image;
    const gridItem = document.createElement('div');
    gridItem.className = 'grid-item';
    gridItem.dataset.filename = filename;

    const img = document.createElement('img');
    img.src = src;
    gridItem.appendChild(img);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      const userKey = prompt("Enter master key to delete this image:");
      if (!userKey) return alert("No key entered.");
      deleteImageFromServer(filename, gridItem, userKey);
    });
    gridItem.appendChild(deleteBtn);
    imageGrid.appendChild(gridItem);
  }

  function deleteImage(filename, gridItem) {
    gridItem.remove();
    let imagesArray = loadImagesFromStorage();
    const index = imagesArray.findIndex(image => image.filename === filename);
    if (index > -1) imagesArray.splice(index, 1);
    saveImagesToStorage(imagesArray);
  }

  fileInput.addEventListener('change', async (event) => {
    const userKey = prompt("Enter master key to upload images:");
    if (!userKey) {
      alert("No key entered. Upload canceled.");
      return;
    }

    const files = Array.from(event.target.files);
    let imagesArray = loadImagesFromStorage();

    for (const file of files) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("password", userKey);  // Include master key in upload

      try {
        const response = await fetch('https://octopus-wall.onrender.com/upload_image', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (response.ok && result.success) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const dataUrl = e.target.result;
            const image = { src: dataUrl, filename: result.filename };
            addImageToGrid(image);
            imagesArray.push(image);
            saveImagesToStorage(imagesArray);
          };
          reader.readAsDataURL(file);
        } else {
          alert("Upload failed: " + (result.error || "Unknown error"));
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred during the file upload.");
      }
    }

    fileInput.value = ''; // Reset input
  });

  async function deleteImageFromServer(filename, gridItem, userKey) {
    try {
      const response = await fetch('https://octopus-wall.onrender.com/delete_image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: userKey, filename })
      });
      const result = await response.json();
      if (response.ok && result.success) {
        alert("Image deleted successfully.");
        deleteImage(filename, gridItem);
      } else {
        alert("Deletion failed: " + (result.error || "Unknown error"));
      }
    } catch (err) {
      console.error(err);
      alert("Error during deletion.");
    }
  }
</script>
</body>
</html>
